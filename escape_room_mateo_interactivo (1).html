const scenes=[
{key:'cover',counter:'PORTADA',title:'El Código de la Alfabetización (1905–1912)',story:'Un viaje por la educación, el Estado y el proyecto de país. Presenta: Antonella Fassio.',choices:[['Comenzar el escape room','Comenzás el recorrido de Mateo, un joven obrero hijo de inmigrantes en Buenos Aires.']],next:1},
{key:'intro',counter:'INTRODUCCIÓN',title:'Año 1905: conocé a Mateo',story:'Mateo trabaja en un taller y vive en un conventillo de Buenos Aires. El ambiente social está atravesado por huelgas y protestas. El Estado Nacional lo persigue y busca disciplinarlo, pero también le abre las puertas de la escuela. Tu objetivo es descifrar el Código de la Emancipación.',choices:[['Entrar a la primera sala','Mateo se acerca a la escuela y enfrenta el primer dilema.']],next:2},
{key:'room1',counter:'SALA 1 DE 3',title:'El Palacio de la Ley 1420 (1884)',story:'El inspector escolar explica que la instrucción es obligatoria, gratuita y laica. Sin embargo, la escuela no ofrece educación técnica e industrial como la que reciben las élites en los Colegios Nacionales. El dilema de Tedesco: ¿la escuela busca formar o controlar?',choices:[['A · Aceptar la escuela como espacio de moralización y docilidad.','Mateo aprende las reglas del sistema, pero corre el riesgo de aceptar el orden sin cuestionarlo. Su transformación prioriza la adaptación.'],['B · Aprovechar la laicidad y la gratuidad para aprender a leer sin dejarse adoctrinar.','Mateo obtiene herramientas para pensar por sí mismo. La alfabetización puede convertirse en una forma de autonomía.']],next:3},
{key:'room2',counter:'SALA 2 DE 3',title:'La Ley Láinez (1905)',story:'Las provincias no llegan a todos los rincones. La Ley Láinez permite que el Estado Nacional cree escuelas primarias en las provincias. ¿Es una medida democratizadora o un centralismo que limita la autonomía provincial?',choices:[['A · Rechazar la Escuela Láinez por centralista e invasora de las autonomías provinciales.','Mateo cuestiona el poder central y defiende la autonomía provincial, aunque puede quedar limitado el acceso escolar en zonas sin escuelas.'],['B · Apoyar la llegada de escuelas, aunque el contenido sea mínimo.','Mateo valora que más niños aprendan a leer y escribir, aun cuando el programa sea básico y recortado.']],next:4},
{key:'room3',counter:'SALA 3 DE 3',title:'La paradoja democrática (1912)',story:'El Estado te enseñó a leer para formar al ciudadano que necesitaba el país. ¿Qué harás ahora con lo aprendido? La misma herramienta diseñada para controlar terminó democratizando la sociedad.',choices:[['A · Utilizar tus conocimientos para adaptarte al orden establecido.','Mateo puede desenvolverse dentro del sistema, pero participa menos en su transformación.'],['B · Utilizar tus conocimientos para participar, organizarte y cuestionar ese orden.','Mateo lee periódicos, se organiza con otros trabajadores y cuestiona el fraude electoral. La alfabetización se convierte en participación.']],next:5},
{key:'transform',counter:'TU TRANSFORMACIÓN',title:'Tus decisiones dejan huella',story:'Mateo cambia a lo largo del recorrido: de obrero a estudiante, trabajador rural y ciudadano. No es una transformación automática: depende de cómo use lo aprendido y de las oportunidades y límites que encuentra.',choices:[['Ver el desenlace','La alfabetización no determina por sí sola el futuro de Mateo; le ofrece herramientas que puede usar para adaptarse o cuestionar el orden.']],next:6},
{key:'final',counter:'FINAL',title:'El Estado fue enemigo, aliado involuntario… ¿o ambas cosas?',story:'El Estado te enseñó a leer, pero no podía decidir por completo qué harías con esas palabras. La educación puede ser una herramienta de control y, al mismo tiempo, abrir caminos para la autonomía.',choices:[['Terminar y reflexionar','Compartí en el foro de Moodle: ¿el Estado fue enemigo de Mateo, su aliado involuntario o ambas cosas al mismo tiempo? ¿Qué decisiones de Mateo fundamentan tu respuesta?']],next:-1}
];let idx=0,decisions=[];const $=id=>document.getElementById(id);function render(){let s=scenes[idx];$('sceneimg').src=imgs[s.key];$('sceneimg').alt='Ilustración original: '+s.title;$('counter').textContent=s.counter;$('bar').style.width=(idx/(scenes.length-1)*100)+'%';$('score').textContent='Decisiones: '+decisions.length;$('title').textContent=s.title;$('story').textContent=s.story;$('choices').innerHTML='';$('feedback').style.display='none';$('next').style.display='none';$('walker').innerHTML=(idx>=5?'🧑🏻‍💼':idx>=3?'🧑🏻‍🎓':'🧑🏻‍🏭')+'<span>Mateo avanza</span>';s.choices.forEach((c,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=c[0];b.onclick=()=>choose(i,c[1]);$('choices').appendChild(b)});}function choose(i,msg){let s=scenes[idx];if(s.choices.length>1)decisions.push({scene:idx,choice:i});$('score').textContent='Decisiones: '+decisions.length;$('feedback').textContent=msg;$('feedback').style.display='block';[...$('choices').children].forEach(b=>b.disabled=true);$('next').style.display='inline-block';$('next').textContent=s.next<0?'Volver a empezar ↺':'Continuar →';$('next').onclick=()=>{if(s.next<0){idx=0;decisions=[]}else idx=s.next;render()};}render();
</script></body></html>
